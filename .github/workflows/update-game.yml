name: Update Spidey Profile

on:
  schedule:
    - cron: '0 16 * * *'  # 16:00 UTC = 12:00 AM Manila (UTC+8), daily
  workflow_dispatch:      # Lets you run it manually
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/update-game.yml'

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install pillow

      - name: Generate Spider-Man stats card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_spider_card.py

      - name: Generate web-shooter game
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_web_game.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -m "🕷️ Daily web update: stats + thwip log"
          git pull --rebase origin main
          git push
