name: Update Profile Reports

on:
  schedule:
    - cron: '0 16 * * *'  # 16:00 UTC = 12:00 AM Manila (UTC+8), daily
  workflow_dispatch:      # Lets you run it manually
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install pillow

      # Daily Bugle reports + pixel Web of Activity
      - name: Generate reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_reports.py

      # browsers cache images by URL; a new stamp each run makes them fetch the fresh ones
      - name: Stamp image links
        run: sed -i -E "s/\.(svg|gif|png)\?v=[0-9]+/.\1?v=$(TZ=Asia/Manila date +%Y%m%d%H%M)/g" README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -m "🕷️ Daily Bugle: nightly report"
          git pull --rebase origin main
          git push
