name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: navinskyy
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish snake
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git clone --depth 1 --branch output https://x-access-token:${{ github.token }}@github.com/navinskyy/navinskyy.git output-repo || \
          git clone --depth 1 https://x-access-token:${{ github.token }}@github.com/navinskyy/navinskyy.git output-repo

          cd output-repo

          git checkout --orphan output
          git rm -rf . || true

          cp -r ../dist/* .

          git add .
          git commit -m "Update contribution snake" || true
          git push --force origin output
