<svg width="720" height="260" viewBox="0 0 720 260" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
  <title id="title">Spider-Man climbing a contribution timeline</title>
  <desc id="desc">An animated superhero climbs upward beside green GitHub contribution nodes. If animation is unavailable, the fallback text in the README gives the exact numbers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071a12"/>
      <stop offset="1" stop-color="#020807"/>
    </linearGradient>
    <pattern id="web" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M26 0V52M0 26H52M7 7L45 45M45 7L7 45" stroke="#39d353" stroke-opacity=".14"/>
      <circle cx="26" cy="26" r="13" fill="none" stroke="#39d353" stroke-opacity=".14"/>
    </pattern>
  </defs>
  <rect width="720" height="260" rx="20" fill="url(#bg)"/>
  <rect width="720" height="260" rx="20" fill="url(#web)"/>
  <path d="M360 224V36" stroke="#39d353" stroke-width="5" stroke-linecap="round"/>
  <g fill="#b6fcb6" stroke="#39d353" stroke-width="3">
    <circle cx="360" cy="214" r="10"><title>3 repositories launched in the last 6 months</title></circle>
    <circle cx="360" cy="164" r="10"><title>Project Y: 150 commits</title></circle>
    <circle cx="360" cy="108" r="10"><title>Project X: 300 commits</title></circle>
    <circle cx="360" cy="48" r="10"><title>1,200 contributions in the last year</title></circle>
  </g>
  <g id="climber" transform="translate(325 190)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="325 190;325 132;325 78;325 20;325 190" dur="8s" repeatCount="indefinite"/>
    <path d="M35 28Q17 17 22 0Q36 -12 48 2Q55 17 44 30Z" fill="#d9273f" stroke="#fff" stroke-width="2"/>
    <path d="M31 28L9 45M46 29L69 45M34 45L22 72M47 45L59 72" stroke="#d9273f" stroke-width="12"/>
    <path d="M31 28L9 45M46 29L69 45" stroke="#172c63" stroke-width="4"/>
    <path d="M34 45L22 72M47 45L59 72" stroke="#172c63" stroke-width="5"/>
    <path d="M35 35L43 52M29 42L51 42M34 48L47 48" stroke="#fff" stroke-width="2"/>
    <path d="M26 45Q38 56 51 45" stroke="#fff" stroke-width="2"/>
    <path d="M9 45L0 36M69 45L78 36" stroke="#b6fcb6" stroke-width="2" stroke-dasharray="3 4">
      <animate attributeName="stroke-dashoffset" values="0;-14" dur=".7s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="28" y="236" fill="#b6fcb6" font-family="Arial,sans-serif" font-size="12">🕷️ CLIMBING THE WEB OF CONTRIBUTIONS</text>
</svg>
